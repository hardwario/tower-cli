[package]
name = "tower-cli"
version = "1.0.0"
edition = "2024"
description = "HARDWARIO TOWER console host CLI (`tower`): renders the framed serial link from the tower firmware."
license = "MIT"
repository = "https://github.com/hardwario/tower-cli"

[[bin]]
name = "tower"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serialport = "4"
rustyline = "14"
ratatui = "0.29"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
postcard = { version = "1", default-features = false }
serde = "1"
# Single source of truth for the wire format, shared with the firmware (which depends on the
# same crate + tag). postcard isn't self-describing, so both ends MUST be the same version —
# pinned to a tag so a standalone clone builds reproducibly. Bump in lockstep with any wire
# change. For side-by-side development against a local checkout, see `.cargo/config.toml`
# (gitignored `paths` override) — it doesn't touch Cargo.lock or affect other clones.
tower-protocol = { git = "https://github.com/hardwario/tower-protocol", tag = "v1.0.0" }
# STM32L0 UART-bootloader engine (flash / erase / reset), shared with the standalone
# `jolt` CLI. Pinned to a tag so a standalone clone builds reproducibly, like
# tower-protocol above. For side-by-side dev against a local checkout, see the
# `.cargo/config.toml` `paths` override.
jolt = { git = "https://github.com/hardwario/jolt", tag = "v1.3.0", default-features = false }

[dev-dependencies]
# Tests build wire frames with the protocol's own message types; `ShellCompletions`/`Event`
# carry `heapless::Vec` fields, so the tests need heapless to construct them. `assert_cmd`
# drives the compiled `tower` binary end-to-end (help/usage/exit-code contract) with no
# hardware. Pinned to the same heapless major that tower-protocol resolves.
heapless = "0.9"
assert_cmd = "2"
predicates = "3"

[target.'cfg(unix)'.dependencies]
# Only used to restore the default SIGPIPE disposition at startup (see main()). Rust's
# runtime sets SIGPIPE to SIG_IGN, which turns a closed downstream pipe (`tower logs | head`)
# into an EPIPE that our print!/println! calls unwrap into a panic. Restoring SIG_DFL makes
# the process die quietly on the signal, matching every other Unix CLI.
libc = "0.2"
